# Railway configuration for KENENISA OS API
# Railway detects this and uses it to deploy the service

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"
buildContext = "."

[deploy]
startCommand = "sh -c 'cd apps/api && npx prisma migrate deploy && node dist/server.js'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
